name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-brain:
    name: Lint (adeline-brain)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff==0.4.4
      - name: Lint
        run: ruff check adeline-brain/app/ adeline-brain/tests/

  test-brain:
    name: Tests (adeline-brain)
    runs-on: ubuntu-latest
    needs: lint-brain
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: adeline
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: adeline_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGUSER: adeline
      PGPASSWORD: testpassword
      PGDATABASE: adeline_test
      PGHOST: localhost
      PGPORT: "5432"
      REDIS_URL: redis://localhost:6379/0
      SUPABASE_JWT_SECRET: test-secret-for-ci
      ADELINE_MODEL: gemini-2.5-flash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: |
          cd adeline-brain
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-httpx
      - name: Set up database schema
        run: |
          cd adeline-brain
          psql -f prisma/migrations/apply_all.sql
      - name: Run tests
        run: |
          cd adeline-brain
          export POSTGRES_DSN="postgresql""://${PGUSER}:${PGPASSWORD}@${PGHOST}:${PGPORT}/${PGDATABASE}"
          # NOTE 2026-08-26: audited every ignore/deselect below against a real
          # local Postgres+pgvector+Redis. 449/487 tests pass with none ignored.
          # Removed 4 entries referencing files that no longer exist in the repo
          # (test_genesis_fetch.py, test_sefaria_fetch.py, test_arq_lesson.py,
          # tests/agents/test_orchestrator.py — all deleted in prior commits),
          # plus 6 files that pass 100% clean (77 tests) with no known reason
          # to have been excluded: test_e2e_production_ready.py,
          # test_e2e_declassified_lesson.py, test_e2e_content_filter.py,
          # test_credit_hook.py, test_standards_mapper.py, and
          # test_tavily_rate_limiting.py (which despite its name now guards
          # the DuckDuckGo web-search path that replaced Tavily).
          # The remaining ~35 failures are pre-existing drift unrelated to any
          # single change: mostly tests written against a SQLAlchemy ORM layer
          # since replaced by raw asyncpg (test_hippocampus_source_type.py,
          # test_pgvector_duplicate_detection.py), and tests written before
          # their endpoint required auth (test_projects_api.py,
          # test_e2e_bookshelf.py, parts of test_conversation_api.py). Fixing
          # those is real product/test work, not a CI-config change, so they
          # stay ignored here rather than being silently re-broken.
          pytest tests/ --tb=short -q \
            --ignore=tests/test_e2e_bookshelf.py \
            --ignore=tests/test_conversation_api.py \
            --ignore=tests/test_hippocampus_source_type.py \
            --ignore=tests/test_justice_parser.py \
            --ignore=tests/test_launch_readiness.py \
            --ignore=tests/test_pgvector_duplicate_detection.py \
            --ignore=tests/test_projects_api.py \
            --ignore=tests/test_search_witnesses_deep_web.py \
            --ignore=tests/test_spaced_repetition.py \
            --ignore=tests/test_witness_declassified_integration.py \
            --ignore=tests/services/test_sefaria.py \
            --deselect=tests/algorithms/test_zpd_engine.py::TestComputePriority::test_low_readiness_gives_low_priority \
            -m "not slow"

  lint-ui:
    name: Type Check (adeline-ui)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: pnpm/action-setup@v3
        with:
          version: "10"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type check
        run: cd adeline-ui && pnpm exec tsc --noEmit
