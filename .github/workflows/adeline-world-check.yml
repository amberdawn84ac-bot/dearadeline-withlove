name: Adeline World checks

on:
  pull_request:
    branches: [main]
    paths:
      - "adeline-world/**"
      - ".github/workflows/adeline-world-check.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: adeline-world-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: adeline-world

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: adeline-world/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build and test rendered application
        run: npm test
