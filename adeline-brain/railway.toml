[deploy]
healthcheckPath = "/health/ready"
healthcheckTimeout = 360
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[variables]
RUN_SEEDS = "false"
CANONICAL_SEEDING_ENABLED = "true"
CANONICAL_SEED_BATCH_SIZE = "6"
CANONICAL_SEED_DAY_OF_WEEK = "sun"
CANONICAL_SEED_HOUR = "2"
CANONICAL_SEED_MINUTE = "0"
CANONICAL_SEED_TIMEZONE = "America/Chicago"
